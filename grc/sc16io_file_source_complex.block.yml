id: sc16io_file_source_complex
label: File Source Complex
category: '[sc16io]'

templates:
  imports: from gnuradio import sc16io
  make: sc16io.file_source_complex(${filename}, ${source_type.cpp_value}, ${repeat})

parameters:
- id: source_type
  label: Source Type
  dtype: enum
  default: sc16
  options: [sc16, sc8]
  option_labels: [Complex Integer 16, Complex Integer 8]
  option_attributes:
    cpp_value: ['"sc16"', '"sc8"']
    type: [sc16, sc8]

- id: filename
  label: File
  dtype: file_open

- id: repeat
  label: Repeat
  dtype: bool
  default: 'False'

outputs:
- domain: stream
  dtype: ${source_type.type}

file_format: 1